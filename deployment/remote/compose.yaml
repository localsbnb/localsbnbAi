# 仅供本机存储开发，不连接 Hudson；镜像版本是本地测试基线，非现网版本声明。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: localsbnb_mcp
      POSTGRES_USER: localsbnb_mcp
      POSTGRES_PASSWORD: ${MCP_LOCAL_DB_PASSWORD:?Set MCP_LOCAL_DB_PASSWORD}
    ports:
      - "127.0.0.1:${MCP_LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localsbnb_mcp -d localsbnb_mcp"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.2-alpine
    environment:
      MCP_LOCAL_REDIS_PASSWORD: ${MCP_LOCAL_REDIS_PASSWORD:?Set MCP_LOCAL_REDIS_PASSWORD}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$MCP_LOCAL_REDIS_PASSWORD" --appendonly yes']
    ports:
      - "127.0.0.1:${MCP_LOCAL_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$MCP_LOCAL_REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  redis-data:
